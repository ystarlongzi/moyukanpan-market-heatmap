name: 发布 A 股云图

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heatmap-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: 检出源码
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: 配置 Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: 安装 pnpm 和锁定依赖
        shell: bash
        run: |
          set -Eeuo pipefail
          pnpm_version=$(node -p 'require("./package.json").packageManager.match(/^pnpm@([0-9]+\.[0-9]+\.[0-9]+)$/)?.[1] ?? ""')
          : "${pnpm_version:?请在 package.json 固定 pnpm 版本}"
          npm install --global --ignore-scripts "pnpm@$pnpm_version"
          pnpm install --frozen-lockfile

      - name: 验证应用
        run: |
          pnpm exec next typegen
          pnpm lint
          pnpm typecheck
          pnpm test
          bash -n scripts/deploy-release.sh

      - name: 构建独立运行包
        shell: bash
        run: |
          set -Eeuo pipefail
          pnpm build
          test -s .next/standalone/server.js
          cp -a public .next/standalone/
          cp -a .next/static .next/standalone/.next/
          tar -czf "$RUNNER_TEMP/moyukanpan-heatmap.tar.gz" -C .next/standalone .

      - name: 上传并切换版本
        shell: bash
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          : "${DEPLOY_HOST:?缺少 Variable DEPLOY_HOST}"
          : "${DEPLOY_SSH_PRIVATE_KEY:?缺少 Secret DEPLOY_SSH_PRIVATE_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?缺少 Secret DEPLOY_KNOWN_HOSTS}"
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]] || { echo "DEPLOY_HOST 格式不正确" >&2; exit 1; }
          [[ "$DEPLOY_PORT" =~ ^[1-9][0-9]{0,4}$ ]] && (( DEPLOY_PORT <= 65535 )) || { echo "DEPLOY_PORT 格式不正确" >&2; exit 1; }

          ssh_dir=$(mktemp -d "$RUNNER_TEMP/heatmap-ssh.XXXXXX")
          trap 'rm -rf -- "$ssh_dir"' EXIT
          umask 077
          private_key=${DEPLOY_SSH_PRIVATE_KEY//$'\r'/}
          if [[ "$private_key" != *$'\n'* && "$private_key" == *'\n'* ]]; then
            private_key=${private_key//\n/$'\n'}
          fi
          printf '%s\n' "$private_key" > "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          ssh-keygen -y -P '' -f "$ssh_dir/key" >/dev/null 2>&1 || { echo '部署私钥必须是完整的未加密 SSH 私钥' >&2; exit 1; }
          ssh_options=(-i "$ssh_dir/key" -o "UserKnownHostsFile=$ssh_dir/known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o StrictHostKeyChecking=yes -o BatchMode=yes
            -o IdentitiesOnly=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          remote="heatmap-deploy@$DEPLOY_HOST"
          release="$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          [[ "$release" =~ ^[0-9a-f]{40}-[0-9]+-[0-9]+$ ]] || { echo '部署版本格式不正确' >&2; exit 1; }
          scp -P "$DEPLOY_PORT" "${ssh_options[@]}" "$RUNNER_TEMP/moyukanpan-heatmap.tar.gz" \
            "$remote:/opt/moyukanpan-heatmap/incoming/$release.tar.gz"
          ssh -p "$DEPLOY_PORT" "${ssh_options[@]}" "$remote" "bash -s -- $release" < scripts/deploy-release.sh
